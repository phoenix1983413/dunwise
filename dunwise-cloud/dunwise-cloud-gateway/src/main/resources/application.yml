spring:
  application:
    name: dunwise-cloud-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth
          uri: lb://dunwise-cloud-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: system
          uri: lb://dunwise-cloud-system
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=1
        - id: ai
          uri: lb://dunwise-cloud-ai
          predicates:
            - Path=/ai/**
          filters:
            - StripPrefix=1
        - id: biz
          uri: lb://dunwise-cloud-biz
          predicates:
            - Path=/biz/**
          filters:
            - StripPrefix=1

server:
  port: 9000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
